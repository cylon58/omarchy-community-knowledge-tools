name: Toolkit validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Provide Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify runner prerequisites
        run: |
          git --version
          . /etc/os-release
          test "$ID" = ubuntu && test "$VERSION_ID" = 24.04
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y makepkg
          dpkg-query -W -f='${Package} ${Version}\n' makepkg
          test "$(/usr/bin/vercmp 1:1.0-1 1.0-1)" = 1
          test "$(/usr/bin/vercmp 1.0-2 1.0-1)" = 1
          python -m venv "$RUNNER_TEMP/toolkit-venv"
      - name: Provision the pinned runtime dependency
        run: |
          source "$RUNNER_TEMP/toolkit-venv/bin/activate"
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check --no-deps .
      - name: Run the offline suite and synthetic flow
        run: |
          source "$RUNNER_TEMP/toolkit-venv/bin/activate"
          python -m unittest discover -s tests -q
          python -m examples.synthetic_demo > "$RUNNER_TEMP/synthetic-demo-result.json"
